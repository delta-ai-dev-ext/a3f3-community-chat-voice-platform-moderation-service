- id: community
  label: community_service API-001
  kind: annotation
  role: sync-only
  row: 560
  evidence:
  - path: docs/architecture.md
    quote: Calls `community_service` API-001 for permission + hierarchy checks before
      every moderator action.
  - path: docs/decisions/ADR-001-realtime-fail-closed-authorization.md
    quote: Every moderator action (sanction issue/lift, appeal decision, automod configuration
      read/write, audit-log read) performs a real-time API-001 call to `community_service`
      before any state change.
